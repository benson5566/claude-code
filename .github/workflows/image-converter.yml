name: Image Converter CI

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'examples/image-converter/**'
      - '.github/workflows/image-converter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'examples/image-converter/**'

defaults:
  run:
    working-directory: examples/image-converter

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: examples/image-converter/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        timeout-minutes: 5

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test
    # 只在 push 到 main 時執行 Docker build 驗證
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: examples/image-converter
          push: false
          tags: image-converter:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
